[package]
name = "spm-cli"
version = "0.10.0"
edition = "2021"
rust-version = "1.97"
description = "Skill package manager — declare AI skills in ai.json, materialize them for Claude/Copilot without polluting your repo."
license = "Apache-2.0"
repository = "https://github.com/camunda/spm-cli"
homepage = "https://github.com/camunda/spm-cli"
readme = "README.md"
keywords = ["ai", "skills", "claude", "copilot", "package-manager"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "spm"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
directories = "5"
jsonschema = { version = "0.17", default-features = false }
semver = "1"
yaml-rust2 = { version = "0.13", default-features = false }

# Directory file identity (`pathid::DirId`): std's `MetadataExt::file_index`
# is still unstable. Already in the lock through clap.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

# Effective write access (`fsutil::can_create_in`) without writing a probe
# file. Already in the lock through clap.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Installs the committed git hooks in .cargo-husky/hooks/ into .git/hooks the
# first time `cargo test`/`cargo build` runs — no manual setup step needed.
[dev-dependencies]
cargo-husky = { version = "1", default-features = false, features = ["user-hooks"] }
proptest = { version = "1.12", default-features = false, features = ["std"] }
serde-saphyr = "2.0.0"
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1

# Non-test code propagates errors instead of panicking; tests may unwrap
# (`allow-unwrap-in-tests`/`allow-expect-in-tests` in clippy.toml).
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
