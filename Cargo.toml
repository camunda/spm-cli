[package]
name = "spm"
version = "0.1.0"
edition = "2021"
description = "Skill package manager — declare AI skills in ai.json, materialize them for Claude/Copilot without polluting your repo."

[[bin]]
name = "spm"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
directories = "5"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
