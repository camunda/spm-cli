name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Cancel superseded runs for the same branch/PR to save runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Enforces Conventional Commits on the PR's commit messages via Camunda's
  # reusable workflow. PR-only: it reads github.event.pull_request.* to
  # determine the commit range, so it can only run on pull_request events.
  commitlint:
    if: github.event_name == 'pull_request'
    uses: camunda/sdk-infra/.github/workflows/sdk-commitlint.yml@v1

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test --all
      # The GitHub Actions (action.yml, update/action.yml) are tested against
      # the spm binary `cargo test` just built.
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: test actions
        run: node --test "action/test/*.test.mjs"

  # Runs both actions the way a workflow uses them, from this checkout: setup
  # installs from a file:// release mirror staged from a local build (and must
  # refuse a tampered binary), then update dry-runs over a throwaway project.
  action-e2e:
    name: action e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: build
        run: cargo build
      - name: Stage a local release mirror
        id: stage
        run: |
          set -euo pipefail
          host="$(rustc -vV | sed -n 's/^host: //p')"
          exe=""; [ "$RUNNER_OS" = Windows ] && exe=".exe"
          version="$(node --input-type=module -e 'import { crateVersion } from "./npm/crate.mjs"; console.log(crateVersion("."))')"
          mkdir -p "$RUNNER_TEMP/bin/$host"
          cp "target/debug/spm$exe" "$RUNNER_TEMP/bin/$host/"
          node action/stage-release.mjs --bin-dir "$RUNNER_TEMP/bin" --out "$RUNNER_TEMP/release/v$version" --host
          # A release whose binary no longer matches its SHA256SUMS.
          node action/stage-release.mjs --bin-dir "$RUNNER_TEMP/bin" --out "$RUNNER_TEMP/release/v0.0.0-tampered" --host
          echo tampered > "$RUNNER_TEMP/release/v0.0.0-tampered/spm-$host$exe"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release-url=$(node -p 'require("node:url").pathToFileURL(process.argv[1]).href' "$RUNNER_TEMP/release")" >> "$GITHUB_OUTPUT"
      - name: setup (tampered release)
        id: tampered
        uses: ./
        continue-on-error: true
        with:
          version: v0.0.0-tampered
          release-url: ${{ steps.stage.outputs.release-url }}
      - name: The tampered binary was refused
        run: |
          set -euo pipefail
          test "${{ steps.tampered.outcome }}" = failure
          if command -v spm; then echo "::error::spm was put on PATH"; exit 1; fi
      - name: setup
        id: setup
        uses: ./
        with:
          release-url: ${{ steps.stage.outputs.release-url }}
      - name: spm is on PATH at the reported version
        env:
          SPM_PATH: ${{ steps.setup.outputs.path }}
        run: |
          set -euo pipefail
          test "$(spm --version)" = "spm ${{ steps.stage.outputs.version }}"
          test "${{ steps.setup.outputs.version }}" = "${{ steps.stage.outputs.version }}"
          test "$("$SPM_PATH" --version)" = "spm ${{ steps.stage.outputs.version }}"
      - name: Create an outdated project
        id: project
        run: |
          set -euo pipefail
          g() { git -c user.email=ci@example.com -c user.name=ci -c commit.gpgsign=false "$@"; }
          root="$RUNNER_TEMP/update-e2e"
          mkdir -p "$root/skill" "$root/project"
          printf -- '---\nname: demo\ndescription: Demo skill.\n---\n' > "$root/skill/SKILL.md"
          g -C "$root/skill" init -q -b main
          g -C "$root/skill" add -A
          g -C "$root/skill" commit -qm one
          url="file://$(node -p 'process.argv[1].split("\\").join("/")' "$root/skill")"
          g -C "$root/project" init -q -b main
          (cd "$root/project" && SPM_HOME="$root/home" spm init --target copilot && SPM_HOME="$root/home" spm add "$url" --branch main)
          g -C "$root/project" add -A
          g -C "$root/project" commit -qm "add demo"
          # The action builds update branches on the base as pushed to origin.
          g init -q --bare -b main "$root/origin.git"
          g -C "$root/project" remote add origin "$root/origin.git"
          g -C "$root/project" push -q origin main
          echo two >> "$root/skill/SKILL.md"
          g -C "$root/skill" commit -qam two
          echo "dir=$root/project" >> "$GITHUB_OUTPUT"
          echo "SPM_HOME=$root/home" >> "$GITHUB_ENV"
      - name: update (dry run)
        id: update
        uses: ./update
        with:
          working-directory: ${{ steps.project.outputs.dir }}
          dry-run: "true"
      - name: The outdated skill was found
        run: |
          set -euo pipefail
          test "${{ steps.update.outputs.outdated }}" = 1
          test '${{ steps.update.outputs.pull-requests }}' = '[]'

  # Enforces a minimum line-coverage floor. Uses cargo-llvm-cov; the build
  # fails if coverage drops below COVERAGE_MIN (see Makefile). Ubuntu-only —
  # coverage is platform-independent enough that one runner is sufficient.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: coverage
        run: make coverage-check

  # Fails on a dependency declared in Cargo.toml that no code uses (dead
  # weight in every build and in the supply-chain surface). `cargo-deny`
  # (licenses, advisories, bans) runs in security.yml.
  machete:
    name: unused dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - name: cargo machete
        run: make machete

  # Guards the `rust-version` (MSRV) we publish in Cargo.toml: the matrix above
  # only exercises `stable`, so without this a newer-than-1.97 API could slip in
  # and break `cargo install` for users on the declared minimum toolchain.
  msrv:
    name: msrv (1.97)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97
      - uses: Swatinem/rust-cache@v2
      - name: check
        run: cargo check --locked --all-targets
